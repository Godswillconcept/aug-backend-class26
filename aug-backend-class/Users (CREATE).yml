info:
  name: Users (CREATE)
  type: http

http:
  method: POST
  url: http://localhost:3000/api/users
  body:
    type: form-urlencoded
    data:
      - name: name
        value: Ola
      - name: age
        value: "32"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
