info:
  name: Users (FETCH)
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:3000/api/users?name=Ada&age=12
  params:
    - name: name
      value: Ada
      type: query
    - name: age
      value: "12"
      type: query
  body:
    type: form-urlencoded
    data:
      - name: name
        value: Dave Smith
      - name: age
        value: "12"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
