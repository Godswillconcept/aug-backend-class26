<!-- Create a signup page -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - Backend Development Class</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/stylesheets/signup.css">
</head>

<body>
    <main class="container">
        <span class="badge">Account Registration</span>
        <h1 id="main-heading">Create an Account</h1>
        <p>Sign up to access the Express & Node.js backend portal.</p>

        <form method="POST" class="signup-form" action="/api/signup">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="Full Name" />
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="name@example.com" />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••" />
            </div>

            <div class="actions">
                <button type="submit" class="btn-primary" id="btn-signup">Sign Up</button>
                <a href="/home" class="btn-secondary" id="btn-back">Back to Home</a>
            </div>
        </form>
    </main>
</body>

</html>
