<!-- Create a login page -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Backend Development Class</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/stylesheets/login.css">
</head>

<body>
    <main class="container">
        <img src="/images/logo.jpg" alt="Sample image 1" style="width: 50px; height: 50px; border-radius: 50%;">
        <span class="badge">Account Registration</span>
        <h1 id="main-heading">Login to your Account</h1>
        <p>Login to access the Express & Node.js backend portal.</p>

        <form method="POST" class="signup-form" action="/api/login">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="name@example.com" />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••" />
            </div>

            <div class="actions">
                <button type="submit" class="btn-primary" id="btn-login">Login</button>
                <a href="/signup" class="btn-secondary" id="btn-signup">Back to Signup</a>
            </div>
        </form>
    </main>
</body>

</html>
